<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — WADL</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        background: #0a0a0a;
        color: #F2EDE4;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 380px;
        margin: 0 auto;
        padding: 64px 24px;
        text-align: center;
      }
      h1 {
        font-family: Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 36px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #FF4A2B;
        margin: 0 0 16px;
      }
      p { color: rgba(242, 237, 228, 0.7); line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 20px;
        background: #FF4A2B;
        color: #0a0a0a;
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <p>WADL needs a connection to load this page. Some scanner pages keep working offline once they're cached — open them once online to enable that.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
